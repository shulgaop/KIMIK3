# Конфигурация маршрута «Япония» (route.yaml)
# Единственный источник региональных параметров. Не наследовать настройки
# Фанских гор. Изменения — через задачи TASKS/ с обновлением CONTEXT.md.

route:
  id: japan
  name: "Япония: Фудзи и Кумано Кодо"
  dates:
    start: 2027-09-02
    end: 2027-09-10
  timezone: Asia/Tokyo        # UTC+9, без перехода на летнее время
  languages: [ru]             # гид на русском; японские написания — для навигации
  currency: JPY
  budget_eur:
    main: 1500
    reserve: 1000
  travelers: 1                # уточнить при поступлении данных
  style: пеший                # трекинг + городская логистика, без велосегмента

# Ограничивающие рамки активных регионов (проверка точек и линий генерации).
# Два района треков плюс городской коридор; не путать с bbox Фанских гор.
bbox:
  fuji:      { lat: [35.20, 35.55], lon: [138.55, 139.05] }
  kumano:    { lat: [33.40, 33.95], lon: [135.50, 136.10] }
  corridor:  { lat: [33.60, 35.90], lon: [135.60, 140.00] }   # Осака—Киото—Токио

fuji:
  trail: yoshida              # со стороны Яманаси
  plan: "ночёвка в хижине у 8-й станции, рассвет на вершине"
  season_expected: "2027-07-01..2027-09-10 (по правилам 2026, требует перепроверки)"
  fee_jpy: 4000               # сезон 2026, перепроверить к 2027
  daily_limit: 4000           # Yoshida; ночующие в хижинах не считаются
  gate_closed: "14:00-03:00 без брони хижины"

kumano_kodo:
  route: nakahechi            # классическое направление
  core_days: 3                # Такидзири → Цугизакура → Хонгу → Нати
  onsen: [yunomine, kawayu]

days:
  - { day: 1, date: 2027-09-02, base: Токио,      plan: "прилёт, ночь Токио" }
  - { day: 2, date: 2027-09-03, base: Фудзи,      plan: "5-я станция Subaru Line → хижина у 8-й станции" }
  - { day: 3, date: 2027-09-04, base: Киото,      plan: "рассвет на вершине, спуск, синкансэн в Киото" }
  - { day: 4, date: 2027-09-05, base: Танабэ,     plan: "Киото (полдня) → экспресс Куросио до Кии-Танабэ" }
  - { day: 5, date: 2027-09-06, base: Цугизакура, plan: "трек: Такидзири → Такахара → Цугизакура" }
  - { day: 6, date: 2027-09-07, base: Юноминэ,    plan: "трек: Цугизакура → Кумано Хонгу-тайся, онсэн" }
  - { day: 7, date: 2027-09-08, base: Кацуура,    plan: "Хонгу → Нати (Когумотори или автобус + Даймон-дзака)" }
  - { day: 8, date: 2027-09-09, base: Осака,      plan: "Сингу, Хаятама-тайся → переезд в Осаку" }
  - { day: 9, date: 2027-09-10, base: вылет,      plan: "вылет из Кансая" }

# Запасные сценарии (сентябрь — сезон тайфунов)
fallbacks:
  typhoon: "пересадка на автобусы вдоль Накахэти, сокращённые плечи, резерв по ночёвкам"
  fuji_weather: "обзорный вариант: 5-я станция и Кавагутико без восхождения"

outputs:
  web_guide: true
  kml: true
  ics: true
  print: true
  audioguide: true            # tts_audioguide.py, голос ru-RU-DmitryNeural

publishing:
  target: github_pages        # решение D-001
  visibility: private_repo    # требуется GitHub Pro
  access_gate: password_screen
  no_private_data: true
